name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

# Build secrets (Settings → Secrets and variables → Actions):
#   SQUADFY_API_KEY        → value of API_KEY (read by BuildKonfigConventionPlugin from the environment)
#   GOOGLE_SERVICES_JSON   → full contents of composeApp/google-services.json (gitignored)
#   Both are optional here: without them CI builds with placeholders (.github/ci/google-services.placeholder.json).
#   GOOGLE_SERVICE_INFO_PLIST → full contents of iosApp/iosApp/GoogleService-Info.plist (gitignored; for the iOS job)
env:
  # Debug builds and unit tests don't call the backend: without the secret, CI uses a placeholder key.
  # The release workflow requires the real production secrets.
  API_KEY: ${{ secrets.SQUADFY_API_KEY || 'ci-placeholder-api-key' }}
  # Feature flag environment (spec 013). CI validates PRE; the production release job will set `pro`.
  SQUADFY_ENV: pre

jobs:
  unit-tests:
    name: 🧪 Unit tests (all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set: building with a placeholder (Firebase does not work in this APK)"
            cp .github/ci/google-services.placeholder.json composeApp/google-services.json
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Unit test results
          files: "**/build/test-results/testDebugUnitTest/**/*.xml"

  build:
    name: 🏗️ Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set: building with a placeholder (Firebase does not work in this APK)"
            cp .github/ci/google-services.placeholder.json composeApp/google-services.json
          fi

      - name: Assemble debug
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 7

  static-analysis:
    name: 🔍 Static analysis (ktlint report-only, hardcoded strings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set: building with a placeholder (Firebase does not work in this APK)"
            cp .github/ci/google-services.placeholder.json composeApp/google-services.json
          fi

      # ktlint has ignoreFailures = true until the formatting pass in specs/features/001 lands.
      - name: ktlint
        run: ./gradlew :composeApp:ktlintCheck

      # AC-011-09: blocking, unlike ktlint. User-visible copy lives in composeResources (ES default + values-en).
      - name: No hardcoded UI strings
        run: ./gradlew checkHardcodedStrings

  summary:
    name: "🧾 CI Summary - ${{ github.event.repository.name }}"
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, build]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          {
            echo "## 🧾 Pipeline Summary"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| 🔍 Static analysis (ktlint, i18n) | ${{ needs.static-analysis.result == 'success' && '✅ pass' || format('❌ {0}', needs.static-analysis.result) }} |"
            echo "| 🧪 Unit tests (all modules) | ${{ needs.unit-tests.result == 'success' && '✅ pass' || format('❌ {0}', needs.unit-tests.result) }} |"
            echo "| 🏗️ Assemble debug | ${{ needs.build.result == 'success' && '✅ pass' || format('❌ {0}', needs.build.result) }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mark in red if something went wrong
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job in the pipeline failed -- check the Pipeline Summary." >&2
          exit 1
