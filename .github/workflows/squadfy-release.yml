name: Release

# Spec 011 AC-011-14: signed, minified AAB with the production config, uploaded to Play Internal testing.
# Branch model (ADR-0009):
#   - by hand (Actions → Release → Run workflow) from release/X.Y.Z or hotfix/X.Y.Z: QA build of the candidate;
#   - when a vX.Y.Z tag is pushed on main: the build that is promoted to production in Play Console.
on:
  workflow_dispatch:
    inputs:
      play_status:
        description: "Play release status (draft until the app has passed its first review)"
        type: choice
        options: [draft, completed]
        default: draft
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Secrets of the `production` environment (Settings → Environments → production), so a release needs an
# approval from the required reviewers before the job can read them (ADR-0008):
#   GOOGLE_SERVICES_JSON         → google-services.json of the production Firebase project
#   PRO_BASE_URL_HTTP            → https://<host>/api/v1
#   PRO_BASE_URL_WS              → wss://<host>/ws
#   SIGNING_KEYSTORE_BASE64      → upload keystore (.jks) encoded with `base64 -i upload.jks`
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON    → Play Console service account with release rights on com.kikepb.squadfy
# Optional repository variable: PRIVACY_POLICY_URL (defaults to https://squadfy.app/privacy).
jobs:
  verify:
    name: 🔎 Release ref and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Fails before asking for the `production` approval, so a wrong ref never reaches the secrets
      - name: Check the ref and the version
        id: version
        run: |
          fail() { echo "::error::$1" >&2; exit 1; }
          version=$(sed -nE 's/^projectVersionName = "([^"]+)"/\1/p' gradle/libs.versions.toml)
          case "$GITHUB_REF" in
            refs/tags/v*)
              [ "${GITHUB_REF#refs/tags/v}" = "$version" ] || fail "Tag ${GITHUB_REF#refs/tags/} does not match version $version"
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "Tag ${GITHUB_REF#refs/tags/} is not on main" ;;
            refs/heads/release/*|refs/heads/hotfix/*)
              [ "${GITHUB_REF#refs/heads/*/}" = "$version" ] || fail "Branch ${GITHUB_REF#refs/heads/} does not match version $version" ;;
            *)
              fail "Release builds run from release/X.Y.Z, hotfix/X.Y.Z or a vX.Y.Z tag on main (got $GITHUB_REF)" ;;
          esac
          ./scripts/check-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android-release:
    name: 🚀 Android release ${{ needs.verify.outputs.version }} (Play Internal)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SQUADFY_ENV: pro
      BASE_URL_HTTP: ${{ secrets.PRO_BASE_URL_HTTP }}
      BASE_URL_WS: ${{ secrets.PRO_BASE_URL_WS }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      CRASHLYTICS_MAPPING_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Check release secrets
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          for name in BASE_URL_HTTP BASE_URL_WS KEYSTORE PLAY_JSON GOOGLE_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets:$missing" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json

      - name: Decode upload keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # The HTTPS guard in BuildKonfigConventionPlugin fails the build if the production URLs are not https/wss
      - name: Build signed AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease -PversionCode=${{ github.run_number }}

      - name: Upload AAB and mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ needs.verify.outputs.version }}-${{ github.run_number }}
          path: |
            composeApp/build/outputs/bundle/release/composeApp-release.aab
            composeApp/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload to Play Internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kikepb.squadfy
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          mappingFile: composeApp/build/outputs/mapping/release/mapping.txt
          track: internal
          status: ${{ github.event.inputs.play_status || 'draft' }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
