		E569B0E77A29576F1A12B50A /* Select Firebase config */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Select Firebase config";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copies this build's Firebase config into the app (spec 019 D-14): Debug is the \"Squadfy iOS Dev\" app\n# (com.kikepb.squadfy.dev, PRE) and Release the \"Squadfy iOS Prod\" one (com.kikepb.squadfy, PRO), so development never\n# reports to production. Both files are gitignored (iosApp/Firebase/README.md).\nSOURCE=\"${PROJECT_DIR}/Firebase/${CONFIGURATION}/GoogleService-Info.plist\"\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist\"\nif [ ! -f \"$SOURCE\" ]; then\n  echo \"warning: $SOURCE not found: this build runs without Firebase (see iosApp/Firebase/README.md)\"\n  rm -f \"$DEST\"\n  exit 0\nfi\nmkdir -p \"$(dirname \"$DEST\")\"\ncp \"$SOURCE\" \"$DEST\"\n";
		};
		EB2C28C0ADADBAD0AABBD087 /* Register Google sign-in URL scheme */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Register Google sign-in URL scheme";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Google sign-in comes back to the app through the reversed client id of this build's Firebase config (Debug and\n# Release are different apps), so its URL scheme is added to the built Info.plist instead of being hard-coded (AC-019-23).\nCONFIG=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist\"\nPLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\nSCHEME=$(/usr/libexec/PlistBuddy -c \"Print :REVERSED_CLIENT_ID\" \"$CONFIG\" 2>/dev/null)\nif [ -z \"$SCHEME\" ]; then\n  echo \"warning: GoogleService-Info.plist has no REVERSED_CLIENT_ID: Google sign-in is off (enable Google in Firebase Auth and download the plist again)\"\n  exit 0\nfi\nif /usr/libexec/PlistBuddy -c \"Print :CFBundleURLTypes\" \"$PLIST\" 2>/dev/null | grep -q \"$SCHEME\"; then\n  exit 0\nfi\nINDEX=$(/usr/libexec/PlistBuddy -c \"Print :CFBundleURLTypes\" \"$PLIST\" 2>/dev/null | grep -c \"Dict {\")\n/usr/libexec/PlistBuddy \\\n  -c \"Add :CFBundleURLTypes:$INDEX dict\" \\\n  -c \"Add :CFBundleURLTypes:$INDEX:CFBundleURLName string google-sign-in\" \\\n  -c \"Add :CFBundleURLTypes:$INDEX:CFBundleURLSchemes array\" \\\n  -c \"Add :CFBundleURLTypes:$INDEX:CFBundleURLSchemes:0 string $SCHEME\" \\\n  \"$PLIST\"\n";
		};
